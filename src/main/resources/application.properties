# ─────────────────────────────────────────────────────────────────────────────
# Base configuration – shared across all profiles
# Active profile is set via: --spring.profiles.active=local  OR  prod
# ─────────────────────────────────────────────────────────────────────────────

spring.profiles.active=prod

# Server
server.port=8080
server.servlet.context-path=/exam-backend

# MySQL driver (same everywhere)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart – allow large video chunks (up to 200 MB per chunk)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Admin credentials
admin.username=admin
admin.password=azaLio@2002-18-06
