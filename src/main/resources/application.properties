# Server
server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/exam_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart – allow large video chunks (up to 200 MB per chunk)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Storage – where videos and result HTML files are saved on this machine
storage.base-path=C:/exam-recordings

# Admin credentials
admin.username=admin
admin.password=azaLio@2002-18-06

# CORS – comma-separated list of allowed frontend origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000
